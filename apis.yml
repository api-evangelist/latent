aid: latent
name: Latent
description: 'Latent (Latent Health) is an enterprise pharmacy intelligence platform for health systems,
  built around a clinical agentic engine that reads the chart, reasons over payer policy and drug labels,
  and acts inside the electronic health record. The platform spans four modules — Identify (care-gap
  identification, eligibility screening, site-of-care routing), Access (prior authorization, clinical
  review, appeals generation, benefit routing, payer outreach), Capture (340B eligibility auditing,
  leakage analytics, financial dashboards), and Engage (patient outreach, queue management, outcomes
  analytics). Latent is chart-native and EHR agnostic, integrating with Epic, Cerner and others, and is
  used by more than 45 health systems including Ochsner Health, MetroHealth, Yale New Haven Health, St.
  Luke''s Health System and Henry Ford Health, serving over two million patients annually. Founded by
  Sriram Somasundaram and Rishabh Jain, the company has raised $80M from Spark Capital, Transformation
  Capital, McKesson Ventures, Conviction, General Catalyst and Y Combinator. Latent publishes no public
  developer API, documentation, or SDKs; its integration surface is delivered through EHR-native
  deployment with health-system customers, and its security posture is published on a Vanta-hosted trust
  center with HIPAA-compliant data handling.'
